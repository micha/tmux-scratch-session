[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-scratch-session"
version = "0.1.0"
description = "Open a persistent scratch session in a tmux popup"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]

[project.scripts]
tmux-scratch-session = "tmux_scratch_session.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
